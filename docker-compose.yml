services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config test/config/pebble-config.json
    ports:
      - 14000:14000 # HTTPS ACME API
      - 15000:15000 # HTTPS Management API
    environment:
      PEBBLE_VA_ALWAYS_VALID: 1
      PEBBLE_WFE_NONCEREJECT: 0
    volumes:
      # ':z' relabels for SELinux, without which the mount is unreadable under
      # Podman on RHEL-family hosts. The image is built FROM scratch, so Pebble
      # exits silently when it cannot read its config. Docker ignores the flag
      # on hosts without SELinux.
      - /tmp/pebble/test:/test:z

  # Dev-mode Vault for the test suite. Running it as a container instead of an
  # in-process test cluster keeps github.com/hashicorp/vault out of go.mod.
  vault:
    # Fully qualified so Podman resolves it without prompting for a registry.
    # No IPC_LOCK: dev mode implies disable_mlock, and the capability is not
    # grantable under rootless Podman.
    image: docker.io/hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - 8200:8200
