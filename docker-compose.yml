services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config test/config/pebble-config.json
    ports:
      - 14000:14000 # HTTPS ACME API
      - 15000:15000 # HTTPS Management API
    environment:
      PEBBLE_VA_ALWAYS_VALID: 1
      PEBBLE_WFE_NONCEREJECT: 0
    volumes:
      - /tmp/pebble/test:/test

  # Dev-mode Vault for the test suite. Running it as a container instead of an
  # in-process test cluster keeps github.com/hashicorp/vault out of go.mod.
  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - 8200:8200
